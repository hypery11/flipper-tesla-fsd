name: build

# Builds the Flipper .fap and every ESP32 firmware variant on each push, PR,
# and tag. Tag pushes (v*) also attach all artifacts to the GitHub Release so
# testers can download a coherent build without a local toolchain.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed for the release-upload job on tags

jobs:
  host-tests:
    name: Host unit tests (protocol core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + run protocol-core tests
        run: make -C test check

  flipper-fap:
    name: Flipper .fap (ufbt)
    needs: [host-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ufbt
        run: pip install --upgrade ufbt
      - name: Fetch SDK (release channel)
        run: ufbt update --channel=release
      - name: Build app
        run: ufbt
      - name: Collect .fap
        run: |
          mkdir -p out
          # ufbt drops the artifact in dist/ and/or .ufbt/build/
          find dist .ufbt/build -name 'tesla_mod.fap' -exec cp {} out/ \; 2>/dev/null || true
          ls -la out
          test -f out/tesla_mod.fap
      - uses: actions/upload-artifact@v4
        with:
          name: flipper-tesla_mod-fap
          path: out/tesla_mod.fap
          if-no-files-found: error

  esp32-matrix:
    name: ESP32 ${{ matrix.env }}
    needs: [host-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - m5stack-atom
          - m5stack-atom-matrix
          - m5stack-atom-swap-pins
          - esp32-mcp2515
          - esp32-lilygo
          - lilygo-t2can
          - lilygo-t2can-fd
          - ttgo-tdisplay
          - waveshare-s3-can
          - waveshare-s3-can-2ch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            esp32/.pio
          key: pio-${{ matrix.env }}-${{ hashFiles('esp32/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build ${{ matrix.env }}
        working-directory: esp32
        run: pio run -e ${{ matrix.env }}
      # Loop-task call chains vs. the loop task's stack size, from the .su
      # files the build just wrote. Fails before anything is staged or uploaded.
      - name: Check loop-task stack budget
        working-directory: esp32
        run: python3 ci_check_stack.py ".pio/build/${{ matrix.env }}"
      - name: Stage firmware
        working-directory: esp32
        run: |
          mkdir -p out
          # App-only image — for the in-device OTA updater (dashboard upload).
          cp ".pio/build/${{ matrix.env }}/firmware.bin" "out/tesla-fsd-${{ matrix.env }}.bin"
          # Full-flash merged image (offset 0) — for the browser flasher on a blank board.
          cp ".pio/build/${{ matrix.env }}/firmware-merged.bin" "out/tesla-fsd-${{ matrix.env }}-merged.bin"
          test -f "out/tesla-fsd-${{ matrix.env }}.bin"
          test -f "out/tesla-fsd-${{ matrix.env }}-merged.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-${{ matrix.env }}
          path: esp32/out/*.bin
          if-no-files-found: error

  release:
    name: Attach artifacts to release
    needs: [flipper-fap, esp32-matrix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten + rename
        run: |
          mkdir -p release
          find artifacts -name '*.fap' -exec cp {} release/ \;
          find artifacts -name '*.bin' -exec cp {} release/ \;
          # Self-contained browser flasher — download it and open in Chrome/Edge
          # to flash without hosting anything.
          cp docs/install/index.html release/tesla-flasher.html
          # From disk there is no Pages hostname to auto-detect, so point the
          # downloaded copy at this repo's own Pages firmware directory.
          sed -i "s|var REPO = 'hypery11/flipper-tesla-fsd';|var REPO = '${GITHUB_REPOSITORY}';|" release/tesla-flasher.html
          ls -la release
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --clobber
